services:
  postgres:
    image: postgres:16-alpine
    container_name: redsalud-db
    environment:
      POSTGRES_DB: redsaluddb
      POSTGRES_USER: redsalud
      POSTGRES_PASSWORD: redsalud123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redsalud -d redsaluddb"]
      interval: 5s
      timeout: 5s
      retries: 5

  ms-pacientes:
    build:
      context: .
      dockerfile: ./ms-pacientes/Dockerfile
    container_name: ms-pacientes
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: render
      RENDER_DB_HOST: postgres
      RENDER_DB_PORT: "5432"
      RENDER_DB_NAME: redsaluddb
      RENDER_DB_USER: redsalud
      RENDER_DB_PASSWORD: redsalud123
    depends_on:
      postgres:
        condition: service_healthy

  ms-profesionales:
    build:
      context: .
      dockerfile: ./ms-profesionales/Dockerfile
    container_name: ms-profesionales
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: render
      RENDER_DB_HOST: postgres
      RENDER_DB_PORT: "5432"
      RENDER_DB_NAME: redsaluddb
      RENDER_DB_USER: redsalud
      RENDER_DB_PASSWORD: redsalud123
    depends_on:
      postgres:
        condition: service_healthy

  ms-recetas:
    build:
      context: .
      dockerfile: ./ms-recetas/Dockerfile
    container_name: ms-recetas
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: render
      RENDER_DB_HOST: postgres
      RENDER_DB_PORT: "5432"
      RENDER_DB_NAME: redsaluddb
      RENDER_DB_USER: redsalud
      RENDER_DB_PASSWORD: redsalud123
    depends_on:
      postgres:
        condition: service_healthy

  ms-consultas:
    build:
      context: .
      dockerfile: ./ms-consultas/Dockerfile
    container_name: ms-consultas
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: render
      RENDER_DB_HOST: postgres
      RENDER_DB_PORT: "5432"
      RENDER_DB_NAME: redsaluddb
      RENDER_DB_USER: redsalud
      RENDER_DB_PASSWORD: redsalud123
    depends_on:
      postgres:
        condition: service_healthy

  ms-programas:
    build:
      context: .
      dockerfile: ./ms-programas/Dockerfile
    container_name: ms-programas
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: render
      RENDER_DB_HOST: postgres
      RENDER_DB_PORT: "5432"
      RENDER_DB_NAME: redsaluddb
      RENDER_DB_USER: redsalud
      RENDER_DB_PASSWORD: redsalud123
    depends_on:
      postgres:
        condition: service_healthy

  ms-farmacia:
    build:
      context: .
      dockerfile: ./ms-farmacia/Dockerfile
    container_name: ms-farmacia
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: render
      RENDER_DB_HOST: postgres
      RENDER_DB_PORT: "5432"
      RENDER_DB_NAME: redsaluddb
      RENDER_DB_USER: redsalud
      RENDER_DB_PASSWORD: redsalud123
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      MS_PROFESIONALES_URI: http://ms-profesionales:8081
      MS_PACIENTES_URI: http://ms-pacientes:8082
      MS_RECETAS_URI: http://ms-recetas:8083
      MS_CONSULTAS_URI: http://ms-consultas:8084
      MS_PROGRAMAS_URI: http://ms-programas:8085
      MS_FARMACIA_URI: http://ms-farmacia:8086
    depends_on:
      - ms-profesionales
      - ms-pacientes
      - ms-recetas
      - ms-consultas
      - ms-programas
      - ms-farmacia

volumes:
  pgdata:
