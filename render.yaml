services:
  - type: web
    name: ms-consultas
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./ms-consultas/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: consultas-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: consultas-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: consultas-db
          property: password

databases:
  - name: consultas-db
    databaseName: consultasdb
    plan: free
    region: oregon
