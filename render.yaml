services:
  # ─── ms-pacientes ──────────────────────────────────────
  - type: web
    name: ms-pacientes
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./ms-pacientes/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: RENDER_DB_HOST
        fromDatabase:
          name: redsalud-db
          property: host
      - key: RENDER_DB_PORT
        fromDatabase:
          name: redsalud-db
          property: port
      - key: RENDER_DB_NAME
        fromDatabase:
          name: redsalud-db
          property: database
      - key: RENDER_DB_USER
        fromDatabase:
          name: redsalud-db
          property: user
